version: "1"

services:
  - type: web
    name: token-server
    env: docker
    plan: free
    rootDir: backend/token_server
    dockerContext: ./backend/token_server
    dockerfilePath: ./backend/token_server/Dockerfile
    envVars:
      - fromGroup: agent-example-env-group
    autoDeploy: true

  - type: worker
    name: agent-example
    env: docker
    plan: starter
    rootDir: backend/agent
    dockerContext: ./backend/agent
    dockerfilePath: ./backend/agent/Dockerfile
    envVars:
      - fromGroup: agent-example-env-group
    region: virginia
    maxShutdownDelaySeconds: 300
    scaling:
      minInstances: 1
      maxInstances: 4
      targetCPUPercent: 60
      targetMemoryPercent: 60
